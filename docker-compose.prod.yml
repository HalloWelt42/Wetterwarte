# Produktions-Setup: alles als Container, ein Compose steuert die ganze App.
# Nur das Frontend ist nach aussen offen; Backend/DB/Redis bleiben im internen
# Netz. Daten liegen als Bind-Mount unter ${DATA_DIR} (auf dem Server: die externe SSD). Adressen des Hauses
# (HAUPTADRESSE, LIGHTNING_BASE, OSMLOCAL_BASE, OSMLOCAL_KARTEN) stehen nur in .env.prod, Vorlage .env.prod.example.
# Gebaut wird aus dem Projektwurzelverzeichnis, damit version.json (einzige Quelle der Fassung) in beide Abbilder
# kommt; was in den Baukontext darf, steht in .dockerignore.
name: wetterwarte-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wetterwarte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wetterwarte}
      POSTGRES_DB: ${POSTGRES_DB:-wetterwarte}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wetterwarte} -d ${POSTGRES_DB:-wetterwarte}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wetterwarte}:${POSTGRES_PASSWORD:-wetterwarte}@postgres:5432/${POSTGRES_DB:-wetterwarte}
      REDIS_URL: redis://redis:6379/0
      LIGHTNING_BASE: ${LIGHTNING_BASE:?LIGHTNING_BASE fehlt in .env.prod (Blitz-Dienst)}
      OSMLOCAL_BASE: ${OSMLOCAL_BASE:?OSMLOCAL_BASE fehlt in .env.prod (Schnittstelle des Kartendienstes)}
      KACHEL_CACHE_DIR: /cache
      # Die Oberfläche verweist ohne HTTPS dorthin (nur dort gibt es Mitteilungen aufs Telefon).
      SICHERE_ADRESSE: https://${HAUPTADRESSE:?HAUPTADRESSE fehlt in .env.prod (Adresse des Servers)}:${HTTPS_PORT:-8062}
    volumes:
      # Offline-Kachel-Cache auf der externen SSD (kann mehrere GB werden).
      - ${DATA_DIR:-./data}/kachelcache:/cache
    ports:
      # Kompatibilitaets-API der alten weathercache-Konsumenten (Cutover: 8060).
      - "${API_PORT:-8062}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # nginx setzt sie beim Start in seine Vorlage ein (frontend/nginx.conf.template)
      LIGHTNING_BASE: ${LIGHTNING_BASE:?}
      OSMLOCAL_KARTEN: ${OSMLOCAL_KARTEN:?OSMLOCAL_KARTEN fehlt in .env.prod (Kacheln des Kartendienstes)}
    ports:
      - "${WEB_PORT:-8060}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Sichere Adresse (docs/WARNUNGEN.md): Caddy mit dem Zertifikat der Hausstelle vor dem Frontend. Das Zertifikat legt
  # ./wetter zertifikat vom Mac aus nach ./zertifikate; ohne es startet nur dieser Dienst nicht, 8061 bleibt.
  vorne:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - frontend
    ports:
      - "${HTTPS_PORT:-8062}:443"
    environment:
      WETTERWARTE_HAUPTADRESSE: ${HAUPTADRESSE:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro

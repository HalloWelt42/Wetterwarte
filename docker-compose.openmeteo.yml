# Selbst gehosteter Open-Meteo-Spiegel - Wetterdaten vollstaendig lokal.
#
# Zweck: die App unabhaengig vom oeffentlichen Open-Meteo-Dienst betreiben. Die
# sync-Dienste laden vorprozessierte Modelldaten (DWD-ICON) in ein gemeinsames
# Volume; der api-Dienst serviert daraus dieselbe HTTP-API wie der oeffentliche
# Dienst. Danach in der .env OPEN_METEO_BASE=http://localhost:6154/v1 setzen -
# der Provider-Code bleibt unveraendert.
#
# Host: in der Entwicklung auf dem Mac (localhost, vom Backend erreichbar), im
# Betrieb auf dem Pi. Auf ARM64 (Mac/Pi) ggf. das Image lokal per buildx bauen,
# falls kein passendes Manifest vorliegt - siehe docs/SELBST-GEHOSTET.md.
#
# Start:  docker compose -f docker-compose.openmeteo.yml up -d
# Die exakten Variablen/Kommandos gegen `docker run ghcr.io/open-meteo/open-meteo --help`
# der jeweiligen Image-Version pruefen.
name: wetterwarte-openmeteo

services:
  open-meteo-api:
    image: ghcr.io/open-meteo/open-meteo
    command: ["serve"]
    ports:
      - "6154:8080"
    volumes:
      - openmeteo-data:/app/data
    restart: unless-stopped

  sync-icon-d2:
    image: ghcr.io/open-meteo/open-meteo
    command:
      - "sync"
      - "dwd_icon_d2"
      - "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cloud_cover,dew_point_2m,precipitation,uv_index,visibility"
      - "--past-days"
      - "3"
      - "--repeat-interval"
      - "15"
    volumes:
      - openmeteo-data:/app/data
    restart: unless-stopped

  sync-icon-eu:
    image: ghcr.io/open-meteo/open-meteo
    command:
      - "sync"
      - "dwd_icon_eu"
      - "temperature_2m,weather_code,wind_speed_10m,precipitation,pressure_msl"
      - "--past-days"
      - "3"
      - "--repeat-interval"
      - "30"
    volumes:
      - openmeteo-data:/app/data
    restart: unless-stopped

volumes:
  openmeteo-data:

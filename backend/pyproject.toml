[project]
name = "wetterwarte"
version = "0.1.0"
description = "Wetterwarte Backend - API und Datenschicht der Wetter-App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
    "tzdata>=2026.5",
    "pywebpush>=2.5.0",
    "h5py>=3.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wetterwarte"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

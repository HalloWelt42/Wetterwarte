<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Kein apple-mobile-web-app-status-bar-style black-translucent: damit meldet iOS 26/27 in Startbildschirm-Apps die
         Höhe um eine Statusleiste zu kurz (Leiste unten sitzt zu hoch) und legt die Unschärfe über den Kopf. Ohne die
         Angabe beginnt die Seite unter der Statusleiste (Farbe aus theme-color) und reicht bis ganz unten. -->
    <meta name="apple-mobile-web-app-title" content="Wetterwarte" />
    <!-- Symbole aus frontend/public/symbol.svg (tools/symbole.py), nur als PNG gemeldet wie bei der Kiste: Ein Symbol mit
         sizes="any" (favicon.ico, höchstens 48 Pixel) oder als SVG nimmt das iPhone beim Hinzufügen zum Home-Bildschirm
         als besten Kandidaten und zeigt dann nur den Anfangsbuchstaben. Alte Browser holen /favicon.ico von selbst. -->
    <link rel="manifest" href="/telefon.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Wetterwarte</title>
  </head>
  <body>
    <div id="telefon"></div>
    <script type="module" src="/src/telefon/main.ts"></script>
  </body>
</html>

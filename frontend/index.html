<!doctype html>
<html lang="de" data-theme="hell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wetterwarte" />
    <!-- Symbole aus frontend/public/symbol.svg (tools/symbole.py), nur als PNG gemeldet wie bei der Kiste: Ein Symbol mit
         sizes="any" (favicon.ico, höchstens 48 Pixel) oder als SVG nimmt das iPhone beim Hinzufügen zum Home-Bildschirm
         als besten Kandidaten und zeigt dann nur den Anfangsbuchstaben. Alte Browser holen /favicon.ico von selbst. -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Wetterwarte</title>
    <script>
      // Telefone bekommen die eigene Telefonansicht (docs/TELEFON.md). Die Wahl in der Ansicht
      // ("Zur Desktop-Ansicht" bzw. "Telefonansicht") merkt sich das Gerät; Ort und Profil bleiben.
      (function () {
        try {
          var wahl = JSON.parse(localStorage.getItem("wetterwarte.ansicht") || "null");
          // Telefon = Touch und kurze Bildschirmseite unter 600 Punkten (unabhängig von der Drehung; Tablets nicht).
          var telefon = wahl ? wahl === "telefon" : matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600;
          if (telefon) location.replace("/telefon" + location.search);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Liefert die gebaute SPA aus und leitet API- und Karten-Anfragen weiter
# (same-origin, kein CORS noetig - identisch zum Vite-Proxy in der Entwicklung).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API ans Backend im selben Compose-Netz.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Kartenkacheln an den lokalen osmlocal-Dienst (/karte -> /api/v1).
    location /karte/ {
        rewrite ^/karte/(.*)$ /api/v1/$1 break;
        proxy_pass http://192.168.178.49:8121;
        proxy_set_header Host $host;
    }

    # Welt-Kacheln (hell/dunkel/Satellit) vom lightningmap-Dienst (/kachel -> /api/tile).
    location /kachel/ {
        rewrite ^/kachel/(.*)$ /api/tile/$1 break;
        proxy_pass http://192.168.178.49:8100;
        proxy_set_header Host $host;
    }

    # SPA-Fallback: alle uebrigen Pfade auf index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

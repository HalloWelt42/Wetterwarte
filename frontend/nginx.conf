# Liefert die gebaute SPA aus und leitet API- und Karten-Anfragen weiter
# (same-origin, kein CORS noetig - identisch zum Vite-Proxy in der Entwicklung).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API ans Backend im selben Compose-Netz.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Kartenkacheln an den lokalen osmlocal-Dienst (/karte -> /api/v1).
    location /karte/ {
        rewrite ^/karte/(.*)$ /api/v1/$1 break;
        proxy_pass http://192.168.178.49:8121;
        proxy_set_header Host $host;
    }

    # Welt-Kacheln ueber den cachenden Backend-Endpunkt (Offline-Cache).
    location /kachel/ {
        rewrite ^/kachel/(.*)$ /api/v1/kachel/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Live-Blitze (bbox-Abfrage) vom lightningmap-Dienst (/blitze -> /api/strikes).
    location = /blitze {
        proxy_pass http://192.168.178.49:8100/api/strikes;
        proxy_set_header Host $host;
    }

    # Live-Blitz-WebSocket fuer die Wellen-Simulation (/ws-blitze -> /ws).
    location = /ws-blitze {
        proxy_pass http://192.168.178.49:8100/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # mime.types kennt .webmanifest nicht (sonst application/octet-stream). Eigener Ort statt types-Block,
    # denn ein types-Block hier würde die ganze Typtabelle ersetzen und .js/.css falsch typisieren.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Startseite nie aus dem Zwischenspeicher: nach dem Ausrollen holt jeder Tab die neue Fassung (auch über den
    # SPA-Fallback, der hier landet). Skripte und Gestaltung tragen Prüfsummen im Namen und dürfen lange bleiben.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Abräum-Worker für einen alten, noch registrierten Service Worker: muss bei jeder
    # Aktualisierungsprüfung frisch kommen.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Übrige Dateien ohne Prüfsumme im Namen (Symbole, Manifest): nie aus dem Zwischenspeicher,
    # zwischengespeichert werden nur Daten. Fehlende Dateien mit Endung sind ein 404, nie die
    # Startseite: sonst bekommt ein Skript- oder Bildabruf HTML zurück, und genau so blieb der
    # alte Service Worker hängen.
    location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?|json|txt)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA-Fallback: alle uebrigen Pfade auf index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
